name: Weekly Digest

on:
  schedule:
    # 매주 금요일 21:00 KST = 12:00 UTC
    - cron: '0 12 * * 5'
  workflow_dispatch:

concurrency:
  group: earnings-screener-state
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Send Weekly Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: python weekly_digest.py

      - name: Reset weekly hits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "[]" > data/weekly_hits.json
          git add data/weekly_hits.json
          git diff --cached --quiet || git commit -m "chore: reset weekly_hits.json"
          git push
