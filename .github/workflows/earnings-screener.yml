name: Earnings Screener

on:
  schedule:
    - cron: '0 22,10 * * *'
  workflow_dispatch:

concurrency:
  group: earnings-screener-state
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run Earnings Screener
        env: &bot-env
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          SESSION_NAME: earnings_screener
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURNAROUND_DISCORD_WEBHOOK_URL: ${{ secrets.TURNAROUND_DISCORD_WEBHOOK_URL }}
          TELEGRAM_FOLDER_ID: '0'
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EDGAR_USER_AGENT: 'EarningsScreener admin@example.com'
          SCHEDULE_HOURS: '7,19'
          LOOKBACK_DAYS: '3'
          LOW_52W_THRESHOLD: '0.05'
          LOG_LEVEL: INFO
          PYTHONIOENCODING: utf-8
        run: python -c "import asyncio; from main import run_pipeline; asyncio.run(run_pipeline())"
      - name: Run Turnaround Radar
        env: *bot-env
        run: python turnaround_runner.py
      - name: Commit weekly hits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly_hits.json
          git diff --cached --quiet || git commit -m "chore: update weekly_hits.json"
          git push
